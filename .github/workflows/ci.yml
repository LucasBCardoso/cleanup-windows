name: CI

on:
  push:
    branches: [main]
  pull_request:

# Public repo: the token only reads, even if the repository default is read/write.
permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
      - name: Build
        run: dotnet build Cleanup.sln -c Release
      - name: Test
        run: dotnet test Cleanup.sln -c Release --no-build --logger "console;verbosity=normal"
      # Self-contained folder, zip and Setup.exe (Inno Setup is preinstalled on GitHub's Windows runners).
      - name: Publish
        shell: pwsh
        run: ./scripts/publish.ps1 -Version "1.0.${{ github.run_number }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Cleanup-Setup
          path: artifacts/Cleanup-Setup-*.exe
          if-no-files-found: error
