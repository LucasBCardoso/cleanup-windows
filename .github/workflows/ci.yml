name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build
        run: dotnet build Cleanup.sln -c Release
      - name: Test
        run: dotnet test Cleanup.sln -c Release --no-build --logger "console;verbosity=normal"
