name: Release

# Push a tag like v1.2.0 → build, test, Setup.exe with that version, GitHub Release with the installer attached.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
      # The tag reaches the scripts only through $env:TAG, never pasted into them, and must look like v1.2.3.
      - name: Check tag
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: if ($env:TAG -notmatch '^v\d+\.\d+\.\d+$') { throw "A tag precisa ser vX.Y.Z, veio '$env:TAG'." }
      - name: Test
        run: dotnet test Cleanup.sln -c Release
      - name: Publish
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: ./scripts/publish.ps1 -Version ($env:TAG.TrimStart('v'))
      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          $version = $env:TAG.TrimStart('v')
          $notes = @"
          Instalador do Cleanup para Windows $version.

          Baixe **Cleanup-Setup-$version.exe** e abra. A instalação é só para o seu usuário e não pede administrador.
          Ela cria o atalho no Menu Iniciar e aparece em Configurações › Aplicativos, por onde também se desinstala.
          O Windows 10 22H2 ou o Windows 11 (x64) são necessários.

          O instalador não é assinado. Se o SmartScreen avisar, clique em "Mais informações" e depois em "Executar assim mesmo".
          "@
          gh release create $env:TAG"artifacts/Cleanup-Setup-$version.exe" --title "Cleanup $version" --notes $notes
